<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Leave Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #f0f2f9;
      --card: #fff;
      --text: #222;
      --accent: #4f46e5;
      --radius: 14px;
      --shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ===== NAVBAR ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 32px;
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      color: #fff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    nav {
      display: flex;
      gap: 14px;
    }

    .btn-nav {
      position: relative;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      backdrop-filter: blur(6px);
    }

    .btn-nav:hover {
      background: #fff;
      color: #4338ca;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
    }

    .btn-nav:active {
      transform: scale(0.96);
    }

    /* Back Button Special */
    .btn-back {
      background: #240ca8;
    }

    .btn-back:hover {
      background: #dc2626;
      color: #fff;
    }

    /* Badge */
    .badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ef4444;
      color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #4338ca;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    /* Layout */
    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: var(--card);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 500px;
      margin: auto;
    }

    .card h3 {
      text-align: center;
      margin-bottom: 20px;
    }

  </style>
</head>

<body>

  <header>
    <h1>Accounting and Taxation</h1>
    <nav>
      <button onclick="window.location.href='/userlist_at/'" class="btn-nav">
        User List
      </button>

      <button onclick="window.location.href='/medlist_at/'" class="btn-nav">
        Med List
      </button>

      <button onclick="window.location.href='/leavelist_at/'" class="btn-nav">
        Leave List
        {% if count > 0 %}
          <span class="badge">{{ count }}</span>
        {% endif %}
      </button>

      <button onclick="window.location.href='/adminhome2/'" class="btn-nav btn-back">
        Back
      </button>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h3>Leave Status Overview</h3>
      <canvas id="leaveChart"></canvas>
    </div>
  </div>

<script>
  const ctx = document.getElementById('leaveChart').getContext('2d');

  new Chart(ctx, {
    type: 'pie',
    data: {
      labels: ['Pending', 'Approved', 'Rejected'],
      datasets: [{
        data: [
          {{ pending }},
          {{ approved }},
          {{ rejected }}
        ],
        backgroundColor: [
          '#facc15',
          '#22c55e',
          '#ef4444'
        ],
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: 'bottom'
        }
      }
    }
  });
</script>

</body>
</html>
