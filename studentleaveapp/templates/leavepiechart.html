<!DOCTYPE html>
<html>
<head>
    <title>Leave Status Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2 style="text-align:center;">Leave Application Status</h2>

<div style="width:40%; margin:auto;">
    <canvas id="leaveChart"></canvas>
</div>

<script>
    const ctx = document.getElementById('leaveChart').getContext('2d');
    const leaveChart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['Pending', 'Approved', 'Rejected'],
            datasets: [{
                data: [
                    {{ pending }},
                    {{ approved }},
                    {{ rejected }}
                ],
                backgroundColor: [
                    '#f1c40f',
                    '#2ecc71',
                    '#e74c3c'
                ],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });
</script>

</body>
</html>
