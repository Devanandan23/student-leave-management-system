<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
        }

        .container {
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 15px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-top: 6px solid #0d6efd;
        }

        h2 {
            margin-bottom: 20px;
            color: #0d6efd;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .info-text {
            font-size: 13px;
            color: #555;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #cfd8dc;
            font-size: 14px;
            transition: 0.3s ease;
        }

        .input-group input:focus {
            border-color: #0d6efd;
            outline: none;
            box-shadow: 0 0 6px rgba(13,110,253,0.4);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #0d6efd, #0056d2);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
        }

        .error {
            margin-top: 15px;
            color: #dc3545;
            font-size: 14px;
            font-weight: 500;
        }

        @media(max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Forgot Password</h2>

    <p class="info-text">
        Enter your registered email address and we will send you a reset link.
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <button type="submit" class="btn">Send Reset Link</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
</div>

</body>
</html>
