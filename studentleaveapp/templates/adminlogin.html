<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #d7f2f7, #ffffff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 360px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      text-align: center;
    }
    .login-card h2 {
      margin-bottom: 25px;
      font-weight: 600;
      color: #0097a7;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #555;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }
    .form-group input:focus {
      border-color: #0097a7;
      box-shadow: 0 0 8px rgba(0,151,167,0.3);
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #0097a7;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 12px;
    }
    .btn:hover {
      background: #00796b;
    }
    .btn-back {
      width: 100%;
      padding: 12px;
      border: 2px solid #0097a7;
      border-radius: 10px;
      background: transparent;
      color: #0097a7;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-back:hover {
      background: #0097a7;
      color: #fff;
    }
    .options {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      font-size: 12px;
    }
    .options a {
      color: #0097a7;
      text-decoration: none;
    }
    .options a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Admin Login</h2>
    <!-- Django form integration -->
    <form method="POST" action="{% url 'adminlogin' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" required>
      </div>
      <button type="submit" class="btn">Login</button>
      <button type="button" class="btn-back" onclick="history.back()">Back</button>
      <div class="options">
       
        
      </div>
    </form>
  </div>
</body>
</html>
